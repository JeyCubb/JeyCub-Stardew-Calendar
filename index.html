<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stardew Farm Scheduler & Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%220.9em%22 font-size=%2290%22>📅</text></svg>">
  <!-- Firebase Core & Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <!-- Header -->
  <header>
    <h1>👩‍🌾 Stardew Farm Calendar</h1>
    
    <div style="display: flex; align-items: center;">
      <!-- Year Selection -->
      <div class="year-selector" style="display: flex; align-items: center; gap: 0.5rem; margin-right: 1.5rem; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-glass); border-radius: 8px; padding: 0.35rem 0.75rem;">
        <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Year</span>
        <button id="year-down" class="season-btn" style="padding: 0.15rem 0.5rem; font-size: 0.75rem; border-radius: 4px;">-</button>
        <span id="year-display" style="font-weight: 700; font-size: 0.9rem; min-width: 15px; text-align: center;">1</span>
        <button id="year-up" class="season-btn" style="padding: 0.15rem 0.5rem; font-size: 0.75rem; border-radius: 4px;">+</button>
      </div>

      <!-- Season Selection -->
      <div class="season-selector">
      <button class="season-btn active" data-season="spring">Spring</button>
      <button class="season-btn" data-season="summer">Summer</button>
      <button class="season-btn" data-season="fall">Fall</button>
      <button class="season-btn" data-season="winter">Winter</button>
      </div>
    </div>
  </header>

  <!-- Main Calendar Layout -->
  <main class="main-container">
    <!-- Days of Week Header -->
    <div class="weekday-header">
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
      <div>Sun</div>
    </div>

    <!-- Calendar Grid (28 day cards) -->
    <div class="calendar-grid" id="calendar-grid"></div>
  </main>

  <!-- Task Scheduler Modal (Unified layout) -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Day X</h3>
        <button class="modal-close" id="modal-close">×</button>
      </div>

      <!-- Combined Forms Panel -->
      <div class="modal-forms-container">
        <!-- Section 1: Manual Note -->
        <form id="form-manual" class="dialog-section">
          <div class="form-group-row">
            <input type="text" id="manual-label" placeholder="Enter manual task (e.g., Put starfruit on keg, harvest pigs)..." required>
            <button type="submit" class="btn btn-inline">Add Note</button>
          </div>
        </form>

        <div class="divider"></div>

        <!-- Section 2: Plant Crop -->
        <form id="form-crop" class="dialog-section">
          <h4 class="section-title">🌱 Plant Crop & Forecast</h4>
          <div class="form-group-row">
            <select id="crop-select">
              <option value="starfruit">Starfruit (13 days)</option>
              <option value="ancient">Ancient Fruit (28d + 7d regrow)</option>
              <option value="pumpkin">Pumpkin (13 days)</option>
              <option value="melon">Melon (12 days)</option>
              <option value="cauliflower">Cauliflower (12 days)</option>
              <option value="sweetgem">Sweet Gem Berry (24 days)</option>
            </select>
            <select id="crop-stage">
              <option value="seed">Fresh Seed</option>
              <option value="regrow">Existing Plant (Regrow)</option>
            </select>
            <select id="crop-fert">
              <option value="none">No Fertilizer</option>
              <option value="speed">Speed-Gro (10%)</option>
              <option value="deluxe">Deluxe Speed-Gro (25%)</option>
              <option value="hyper">Hyper Speed-Gro (33%)</option>
            </select>
            <select id="crop-loc">
              <option value="Main Farm">Main Farm</option>
              <option value="Greenhouse">Greenhouse</option>
              <option value="Ginger Island">Ginger Island</option>
            </select>
            <button type="submit" class="btn btn-inline">Plant</button>
          </div>
        </form>

        <div class="divider"></div>

        <!-- Section 3: Load Machine -->
        <form id="form-machine" class="dialog-section">
          <h4 class="section-title">📥 Load Machine or Cask</h4>
          <div class="form-group-row">
            <select id="machine-select">
              <option value="keg_wine">Keg: Fruit -> Wine (7 days)</option>
              <option value="keg_beer">Keg: Wheat/Hops -> Beer/Pale Ale (2 days)</option>
              <option value="preserves">Preserves Jar: Fruit/Veg -> Jelly (3 days)</option>
              <option value="cask_silver">Cask: Silver Quality (14 days)</option>
              <option value="cask_gold">Cask: Gold Quality (28 days)</option>
              <option value="cask_iridium">Cask: Iridium Quality (56 days)</option>
            </select>
            <select id="machine-loc">
              <option value="Shed">Shed</option>
              <option value="Tunnel">Tunnel</option>
              <option value="Greenhouse">Greenhouse</option>
              <option value="Main Farm">Main Farm</option>
              <option value="Ginger Island">Ginger Island</option>
            </select>
            <button type="submit" class="btn btn-inline">Load</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

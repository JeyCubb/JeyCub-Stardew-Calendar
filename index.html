<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Stardew Valley Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- Firebase Core & Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <!-- Header -->
  <header>
    <div style="display: flex; align-items: center; gap: 1.25rem;">
      <h1 style="display: flex; align-items: center; gap: 0.5rem;">
        <img src="favicon.png" alt="Stardew Chicken" style="width: 32px; height: 32px; image-rendering: pixelated;">
        Stardew Valley Tracker
      </h1>

      <!-- Mode Switcher (Calendar vs Perfection Tracker vs Farm Planner) -->
      <div class="view-mode-selector" style="display: flex; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--border-glass); border-radius: 10px; padding: 3px; gap: 4px;">
        <button id="btn-view-calendar" class="view-tab-btn active" style="padding: 0.35rem 0.85rem; font-size: 0.82rem; font-weight: 600; border-radius: 7px; border: none; cursor: pointer; transition: all 0.2s ease;">📅 Calendar</button>
        <button id="btn-view-tracker" class="view-tab-btn" style="padding: 0.35rem 0.85rem; font-size: 0.82rem; font-weight: 600; border-radius: 7px; border: none; cursor: pointer; transition: all 0.2s ease;">⭐ Perfection Tracker</button>
        <button id="btn-view-planner" class="view-tab-btn" style="padding: 0.35rem 0.85rem; font-size: 0.82rem; font-weight: 600; border-radius: 7px; border: none; cursor: pointer; transition: all 0.2s ease;">🚜 Farm Planner</button>
      </div>
    </div>
    
    <!-- Controls container for Calendar view -->
    <div id="calendar-header-controls" style="display: flex; align-items: center;">
      <!-- Toggle Labels Button -->
      <button id="btn-toggle-labels" class="season-btn" style="margin-right: 1rem; padding: 0.35rem 0.75rem; font-size: 0.8rem; display: flex; align-items: center; gap: 0.35rem; border-radius: 8px; border: 1px solid var(--border-glass);">
        <span id="label-toggle-icon">👁️</span> <span id="label-toggle-text">Labels: Hover</span>
      </button>

      <!-- Year Selection -->
      <div class="year-selector" style="display: flex; align-items: center; gap: 0.5rem; margin-right: 1.5rem; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-glass); border-radius: 8px; padding: 0.35rem 0.75rem;">
        <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Year</span>
        <button id="year-down" class="season-btn" style="padding: 0.15rem 0.5rem; font-size: 0.75rem; border-radius: 4px;">-</button>
        <span id="year-display" style="font-weight: 700; font-size: 0.9rem; min-width: 15px; text-align: center;">1</span>
        <button id="year-up" class="season-btn" style="padding: 0.15rem 0.5rem; font-size: 0.75rem; border-radius: 4px;">+</button>
      </div>

      <!-- Season Selection -->
      <div class="season-selector">
        <button class="season-btn active" data-season="spring">Spring</button>
        <button class="season-btn" data-season="summer">Summer</button>
        <button class="season-btn" data-season="fall">Fall</button>
        <button class="season-btn" data-season="winter">Winter</button>
      </div>
    </div>

    <!-- Controls container for Perfection Tracker view -->
    <div id="tracker-header-controls" style="display: none; align-items: center; gap: 0.75rem;">
      <div class="tracker-sheet-selector" style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
        <button class="tracker-tab-btn active" data-sheet="shipped">📦 Produce & Forage</button>
        <button class="tracker-tab-btn" data-sheet="crafting">🔨 Crafting Recipes</button>
        <button class="tracker-tab-btn" data-sheet="cooking">🍳 Cooking Recipes</button>
        <button class="tracker-tab-btn" data-sheet="fish">🎣 Fish Caught</button>
        <button class="tracker-tab-btn" data-sheet="museum">🏺 Museum</button>
        <button class="tracker-tab-btn" data-sheet="walnuts">🌰 Golden Walnuts</button>
      </div>
    </div>
  </header>

  <!-- Main Calendar Layout -->
  <main class="main-container" id="calendar-main-view">
    <!-- Days of Week Header -->
    <div class="weekday-header">
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
      <div>Sun</div>
    </div>

    <!-- Calendar Grid (28 day cards) -->
    <div class="calendar-grid" id="calendar-grid"></div>
  </main>

  <!-- Main Perfection Tracker Layout -->
  <main class="main-container" id="tracker-main-view" style="display: none; overflow-y: auto;">
    <!-- Tracker Progress Bar Card -->
    <div class="tracker-summary-card">
      <div class="tracker-summary-header">
        <div>
          <h2 id="tracker-sheet-title" style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.2rem;">📦 Produce & Forage Shipped</h2>
          <p id="tracker-sheet-desc" style="font-size: 0.85rem; color: var(--text-muted);">Ship one of every farm produce, forage, animal product, artisan good, and resource.</p>
        </div>
        <div style="text-align: right;">
          <div id="tracker-progress-count" style="font-size: 1.2rem; font-weight: 700; color: var(--accent-gold);">0 / 154 (0%)</div>
          <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">Items Completed</div>
        </div>
      </div>
      <div class="tracker-progress-track">
        <div class="tracker-progress-fill" id="tracker-progress-bar" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Tracker Filter & Search Bar -->
    <div class="tracker-filter-bar" style="display: flex; gap: 0.75rem; margin-bottom: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap;">
      <div id="tracker-subfilters" style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
        <!-- Dynamic season/category subfilter buttons -->
      </div>
      <input type="text" id="tracker-search-input" placeholder="Search item, location, or source..." style="padding: 0.45rem 0.85rem; border-radius: 8px; border: 1px solid var(--border-glass); background: rgba(255,255,255,0.04); color: var(--text-main); font-size: 0.85rem; min-width: 220px;">
    </div>

    <!-- Tracker Items Grid -->
    <div id="tracker-items-grid" class="tracker-grid"></div>
  </main>

  <!-- Main Farm Planner Layout -->
  <main id="planner-main-view" style="display: none; width: 100vw; height: calc(100vh - 44px); max-width: none; margin: 0; padding: 0; overflow: hidden; position: relative;">
    <iframe id="planner-frame" src="planner/index.html" style="width: 100%; height: 100%; border: none; background: #1e1b14; display: block;" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  </main>


  <!-- Task Scheduler Modal (Unified layout) -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Day X</h3>
        <button class="modal-close" id="modal-close">×</button>
      </div>

      <!-- Combined Forms Panel -->
      <div class="modal-forms-container">
        <!-- Current Tasks List (highly readable on phone screens) -->
        <div id="modal-tasks-section" style="margin-bottom: 1rem; display: none;">

          <div id="modal-tasks-list" style="display: flex; flex-direction: column; gap: 0.35rem; max-height: 150px; overflow-y: auto; background: rgba(255,255,255,0.02); border: 1px solid var(--border-glass); padding: 0.5rem; border-radius: 8px;">
            <!-- Tasks dynamically rendered in JS -->
          </div>
          <div class="divider" style="margin-top: 1rem;"></div>
        </div>

        <!-- Section 2: Plant Crop -->
        <form id="form-crop" class="dialog-section">
          <h4 class="section-title">🌱 Plant Crop & Forecast</h4>
          <div class="form-group-row">
            <select id="crop-select" style="flex-grow: 1;"></select>
            <button type="button" id="btn-manage-crops" class="btn btn-inline" style="background: rgba(255,255,255,0.06); padding: 0.45rem 0.6rem; font-size: 0.8rem; border: 1px solid var(--border-glass); border-radius: 6px; white-space: nowrap;">⚙️ Manage</button>
          </div>
          <div class="form-group-row" style="margin-top: 0.15rem;">
            <select id="crop-stage">
              <option value="seed">Fresh Seed</option>
              <option value="regrow">Existing Plant (Regrow)</option>
            </select>
            <select id="crop-fert">
              <option value="none">No Fertilizer</option>
              <option value="speed">Speed-Gro (10%)</option>
              <option value="deluxe">Deluxe Speed-Gro (25%)</option>
              <option value="hyper">Hyper Speed-Gro (33%)</option>
            </select>
            <select id="crop-loc">
              <option value="Main Farm">Main Farm</option>
              <option value="Greenhouse">Greenhouse</option>
              <option value="Ginger Island">Ginger Island</option>
              <option value="Desert">Desert</option>
            </select>
            <button type="submit" class="btn btn-inline">Plant</button>
          </div>
        </form>

        <div class="divider"></div>

        <!-- Section 3: Load Machine -->
        <form id="form-machine" class="dialog-section">
          <h4 class="section-title">📥 Load Machine</h4>
          <div class="form-group-row">
            <select id="machine-select" style="flex-grow: 1;"></select>
            <button type="button" id="btn-manage-machines" class="btn btn-inline" style="background: rgba(255,255,255,0.06); padding: 0.45rem 0.6rem; font-size: 0.8rem; border: 1px solid var(--border-glass); border-radius: 6px; white-space: nowrap;">⚙️ Manage</button>
          </div>
          <div class="form-group-row" style="margin-top: 0.15rem;">
            <select id="machine-loc" style="flex-grow: 1;">
              <option value="Shed">Shed</option>
              <option value="Main Farm">Main Farm</option>
              <option value="Quarry">Quarry</option>
              <option value="Tunnel">Tunnel</option>
              <option value="Greenhouse">Greenhouse</option>
              <option value="Ginger Island">Ginger Island</option>
              <option value="Desert">Desert</option>
            </select>
            <button type="submit" class="btn btn-inline">Load</button>
          </div>
        </form>

        <div class="divider"></div>

        <!-- Section 1: Manual Note -->
        <form id="form-manual" class="dialog-section">
          <div class="form-group-row">
            <input type="text" id="manual-label" placeholder="Enter manual task (e.g., Put starfruit on keg, harvest pigs)..." required>
            <button type="submit" class="btn btn-inline">Add Note</button>
          </div>
        </form>

      </div>
    </div>
  </div>
  <!-- Manage Crops Modal Overlay -->
  <div class="modal-overlay" id="crop-manager-overlay" style="display: none; z-index: 1100;">
    <div class="modal" style="width: 450px; max-width: 95%;">
      <div class="modal-header">
        <h3 id="manager-title">⚙️ Manage Items list</h3>
        <button class="modal-close" id="crop-manager-close">×</button>
      </div>
      <div style="padding: 1rem 0;">
        <div class="tab-header" style="display: flex; gap: 0.5rem; margin-bottom: 0.85rem;">
          <button id="tab-btn-crops" class="season-btn active" style="flex: 1; padding: 0.45rem; border-radius: 6px; font-size: 0.85rem;">Crops</button>
          <button id="tab-btn-machines" class="season-btn" style="flex: 1; padding: 0.45rem; border-radius: 6px; font-size: 0.85rem;">Machines</button>
        </div>
        <input type="text" id="crop-search-input" placeholder="Search..." style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border-glass); background: rgba(255,255,255,0.03); color: var(--text-main); font-size: 0.9rem; margin-bottom: 1rem;">
        
        <div id="crop-manager-list" style="display: flex; flex-direction: column; gap: 0.5rem; max-height: 300px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 0.5rem; border: 1px solid var(--border-glass);">
          <!-- Dynamically rendered checkbox list of crops or machines -->
        </div>
      </div>
    </div>
  </div>

  <script src="perfection_data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
      if ('caches' in window) {
        caches.keys().then((names) => {
          for (let name of names) {
            caches.delete(name);
          }
        });
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stardew Farm Scheduler & Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <header>
    <h1>👩‍🌾 Stardew Farm Calendar</h1>
    
    <!-- Season Selection -->
    <div class="season-selector">
      <button class="season-btn active" data-season="spring">Spring</button>
      <button class="season-btn" data-season="summer">Summer</button>
      <button class="season-btn" data-season="fall">Fall</button>
      <button class="season-btn" data-season="winter">Winter</button>
    </div>
  </header>

  <!-- Main Calendar Layout -->
  <main class="main-container">
    <!-- Days of Week Header -->
    <div class="weekday-header">
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
      <div>Sun</div>
    </div>

    <!-- Calendar Grid (28 day cards) -->
    <div class="calendar-grid" id="calendar-grid"></div>

    <!-- Meta / Statistics summary -->
    <div class="meta-stats">
      <div class="meta-box">
        <div class="meta-val" id="stat-crops">0</div>
        <div class="meta-lbl">Crops Harvested</div>
      </div>
      <div class="meta-box">
        <div class="meta-val" id="stat-kegs">0</div>
        <div class="meta-lbl">Keg runs ready</div>
      </div>
      <div class="meta-box">
        <div class="meta-val" id="stat-casks">0</div>
        <div class="meta-lbl">Casks aging completed</div>
      </div>
    </div>
  </main>

  <!-- Task Scheduler Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Day X</h3>
        <button class="modal-close" id="modal-close">×</button>
      </div>

      <!-- Option Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="tab-manual">Manual Note</button>
        <button class="tab-btn" data-tab="tab-crops">Plant Crop</button>
        <button class="tab-btn" data-tab="tab-machines">Load Machine</button>
      </div>

      <!-- Tab Content: Manual Note -->
      <div class="tab-content active" id="tab-manual">
        <form id="form-manual">
          <div class="form-group">
            <label for="manual-label">Action Description</label>
            <input type="text" id="manual-label" placeholder="e.g. Put starfruit on keg, sell pigs, etc." required>
          </div>
          <button type="submit" class="btn">Add to Calendar</button>
        </form>
      </div>

      <!-- Tab Content: Crops Scheduler -->
      <div class="tab-content" id="tab-crops">
        <form id="form-crop">
          <div class="form-group">
            <label for="crop-select">Select Crop</label>
            <select id="crop-select">
              <option value="starfruit">Starfruit (13 days)</option>
              <option value="ancient">Ancient Fruit (28 days + 7d regrow)</option>
              <option value="pumpkin">Pumpkin (13 days)</option>
              <option value="melon">Melon (12 days)</option>
              <option value="cauliflower">Cauliflower (12 days)</option>
              <option value="sweetgem">Sweet Gem Berry (24 days)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="crop-fert">Fertilizer Used</label>
            <select id="crop-fert">
              <option value="none">None (Base speed)</option>
              <option value="speed">Speed-Gro (10% faster)</option>
              <option value="deluxe">Deluxe Speed-Gro (25% faster)</option>
              <option value="hyper">Hyper Speed-Gro (33% faster)</option>
            </select>
          </div>
          <button type="submit" class="btn">Calculate & Schedule Harvest</button>
        </form>
      </div>

      <!-- Tab Content: Machines & Casks -->
      <div class="tab-content" id="tab-machines">
        <form id="form-machine">
          <div class="form-group">
            <label for="machine-select">Processing Machine</label>
            <select id="machine-select">
              <option value="keg_wine">Keg: Fruit -> Wine (7 days)</option>
              <option value="keg_beer">Keg: Wheat/Hops -> Beer/Pale Ale (2 days)</option>
              <option value="preserves">Preserves Jar: Fruit/Veg -> Jelly/Pickles (3 days)</option>
              <option value="cask_silver">Cask Aging: Silver Quality (14 days)</option>
              <option value="cask_gold">Cask Aging: Gold Quality (28 days / 1 season)</option>
              <option value="cask_iridium">Cask Aging: Iridium Quality (56 days / 2 seasons)</option>
            </select>
          </div>
          <button type="submit" class="btn">Schedule Processing</button>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
